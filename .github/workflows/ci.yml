name: CI

# Template only — has never run. See docs/PROJECT_STATUS.md.
# The Step-1 contract prohibits committing/pushing from this repository until
# the product owner activates CI and this workflow has executed at least once.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
